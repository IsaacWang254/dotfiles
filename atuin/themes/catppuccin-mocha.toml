# Catppuccin Mocha for atuin's interactive search.
#
# atuin has no bundled Catppuccin, so this file is vendored. It is loaded by
# name from atuin/config.toml ([theme] name = "catppuccin-mocha"), and
# install.sh symlinks it to ~/.config/atuin/themes/.
#
# atuin's own docs say values must be lowercase names from the palette crate's
# named-colour list, but hex works and is what the rest of this repo uses --
# verified by the rendered escape codes (#f38ba8 came back as 38;2;243;139;168).
[theme]
name = "catppuccin-mocha"

[colors]
AlertInfo  = "#a6e3a1"  # green
AlertWarn  = "#f9e2af"  # yellow
AlertError = "#f38ba8"  # red
Annotation = "#6c7086"  # overlay0
Base       = "#cdd6f4"  # text
Guidance   = "#94e2d5"  # teal
Important  = "#cba6f7"  # mauve
