# Gruvbox Dark Hard for atuin's interactive search.
#
# atuin has no bundled Gruvbox, so this file is vendored. It is loaded by
# name from atuin/config.toml ([theme] name = "gruvbox-dark"), and
# install.sh symlinks it to ~/.config/atuin/themes/.
#
# atuin's own docs say values must be lowercase names from the palette crate's
# named-colour list, but hex works and is what the rest of this repo uses.
[theme]
name = "gruvbox-dark"

[colors]
AlertInfo  = "#b8bb26"  # green
AlertWarn  = "#fabd2f"  # yellow
AlertError = "#fb4934"  # red
Annotation = "#928374"  # gray
Base       = "#ebdbb2"  # fg
Guidance   = "#8ec07c"  # aqua
Important  = "#fe8019"  # orange
