# AeroSpace config — keyboard-driven tiling for macOS.
# https://nikitabobko.github.io/AeroSpace/guide
#
# Modifier is Option (alt). Either Option key works.
#
# These bindings are shaped around the Corne (see ../corne/README.md), whose
# base layer has Ctrl, Shift and Cmd but reaches Alt only through the right
# thumb's hold, and keeps the digits on layer 1 behind the left thumb. So
# `alt-1` would mean pinning both thumbs and reaching the top row — the worst
# chord on the board for the most-used action in a tiling WM.
#
# Workspaces are therefore named and keyed by PURPOSE, on base-layer letters:
# one thumb plus one key. They work identically on the laptop keyboard.
#
#   E editor   T terminal   B browser   N notes   C work comms (mail, teams, slack)
#   D personal chat (discord, messages)   M media (spotify)

# Start AeroSpace at login.
start-at-login = true

# Normalize the tree so layouts stay predictable.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout for new workspaces. One window still fills the screen; a
# second window should split. Accordion (alt-comma) and fullscreen (alt-f)
# both look like stacked full-screen windows, so drop-in bindings below
# force the workspace root back to tiles.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'   # widescreen -> horizontal, tall -> vertical


# Keep the mouse with the focused window when switching monitors.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps between windows and screen edges.

# ---------------------------------------------------------------------------
# Send apps to their workspace on launch
# ---------------------------------------------------------------------------
# Bundle ids read from each app's Info.plist. An app not listed here just opens
# wherever you are, which is the right default for one-offs like Preview.
#
# New windows are forced tiling (not floating / native-fullscreen) before any
# workspace move. After a move, `layout --root tiles` splits with whatever is
# already on that workspace instead of stacking two full-size windows.
#
# Apps that should stay floating (settings panes, recorders, popups) are listed
# first. Callbacks stop at the first match unless check-further-callbacks is set,
# so these never hit the catch-all tiling rule below.

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'so.cap.desktop'
run = 'layout floating'

[[on-window-detected]]
check-further-callbacks = true
run = ['macos-native-fullscreen off', 'fullscreen off', 'layout tiling']

[[on-window-detected]]           # Cursor
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = ['move-node-to-workspace E', 'flatten-workspace-tree --workspace E', 'layout --workspace E --root tiles']

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = ['move-node-to-workspace E', 'flatten-workspace-tree --workspace E', 'layout --workspace E --root tiles']

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['move-node-to-workspace E', 'flatten-workspace-tree --workspace E', 'layout --workspace E --root tiles']

[[on-window-detected]]
if.app-id = 'com.jetbrains.intellij'
run = ['move-node-to-workspace E', 'flatten-workspace-tree --workspace E', 'layout --workspace E --root tiles']

[[on-window-detected]]
if.app-id = 'com.apple.dt.Xcode'
run = ['move-node-to-workspace E', 'flatten-workspace-tree --workspace E', 'layout --workspace E --root tiles']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace T', 'flatten-workspace-tree --workspace T', 'layout --workspace T --root tiles']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['move-node-to-workspace B', 'flatten-workspace-tree --workspace B', 'layout --workspace B --root tiles']

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace B', 'flatten-workspace-tree --workspace B', 'layout --workspace B --root tiles']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace N', 'flatten-workspace-tree --workspace N', 'layout --workspace N --root tiles']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace C', 'flatten-workspace-tree --workspace C', 'layout --workspace C --root tiles']

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['move-node-to-workspace C', 'flatten-workspace-tree --workspace C', 'layout --workspace C --root tiles']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace D', 'flatten-workspace-tree --workspace D', 'layout --workspace D --root tiles']

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['move-node-to-workspace D', 'flatten-workspace-tree --workspace D', 'layout --workspace D --root tiles']

# Only the main viewer (title ends in "N messages"). This rule fires for EVERY
# new window, so matching the bare app-id also yanked compose windows and the
# search popup to C, dragging focus away mid-typing.
[[on-window-detected]]
if.app-id = 'com.apple.mail'
if.window-title-regex-substring = 'messages?$'
run = ['move-node-to-workspace C', 'flatten-workspace-tree --workspace C', 'layout --workspace C --root tiles']

[[on-window-detected]]
if.app-id = 'notion.mail.id'
run = ['move-node-to-workspace C', 'flatten-workspace-tree --workspace C', 'layout --workspace C --root tiles']

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace M', 'flatten-workspace-tree --workspace M', 'layout --workspace M --root tiles']

# ---------------------------------------------------------------------------
# Main mode
# ---------------------------------------------------------------------------
[mode.main.binding]

# Focus (vim hjkl)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move the focused window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize — on the outer column, since minus/equal live on Corne layer 1
alt-semicolon = 'resize smart -50'
alt-quote     = 'resize smart +50'
alt-shift-quote = 'balance-sizes'

# Layout toggles
alt-slash = 'layout tiles horizontal vertical'   # switch tiling orientation
alt-comma = 'layout accordion horizontal vertical'
alt-f     = 'fullscreen'
alt-shift-space = 'layout floating tiling'        # float / unfloat the window

# Workspaces (switch)
alt-e = 'workspace E'    # editor
alt-t = 'workspace T'    # terminal
alt-b = 'workspace B'    # browser
alt-n = 'workspace N'    # notes
alt-c = 'workspace C'    # work comms (mail, teams, slack)
alt-d = ['workspace D', 'exec-and-forget open -a Discord; open -a Messages']
alt-m = 'workspace M'    # media

# Send window to workspace, follow it, and split with whatever is already there.
# Without --root tiles, a fullscreen/accordion destination keeps both windows
# stacked at full size.
alt-shift-e = ['macos-native-fullscreen off', 'fullscreen off', 'layout tiling', 'move-node-to-workspace E --focus-follows-window', 'flatten-workspace-tree --workspace E', 'layout --workspace E --root tiles']
alt-shift-t = ['macos-native-fullscreen off', 'fullscreen off', 'layout tiling', 'move-node-to-workspace T --focus-follows-window', 'flatten-workspace-tree --workspace T', 'layout --workspace T --root tiles']
alt-shift-b = ['macos-native-fullscreen off', 'fullscreen off', 'layout tiling', 'move-node-to-workspace B --focus-follows-window', 'flatten-workspace-tree --workspace B', 'layout --workspace B --root tiles']
alt-shift-n = ['macos-native-fullscreen off', 'fullscreen off', 'layout tiling', 'move-node-to-workspace N --focus-follows-window', 'flatten-workspace-tree --workspace N', 'layout --workspace N --root tiles']
alt-shift-c = ['macos-native-fullscreen off', 'fullscreen off', 'layout tiling', 'move-node-to-workspace C --focus-follows-window', 'flatten-workspace-tree --workspace C', 'layout --workspace C --root tiles']
alt-shift-d = ['macos-native-fullscreen off', 'fullscreen off', 'layout tiling', 'move-node-to-workspace D --focus-follows-window', 'flatten-workspace-tree --workspace D', 'layout --workspace D --root tiles']
alt-shift-m = ['macos-native-fullscreen off', 'fullscreen off', 'layout tiling', 'move-node-to-workspace M --focus-follows-window', 'flatten-workspace-tree --workspace M', 'layout --workspace M --root tiles']

# Jump back to the previous workspace / bounce a window between monitors
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Enter service mode for the less-common stuff
alt-shift-semicolon = 'mode service'

# ---------------------------------------------------------------------------
# Service mode — press alt-shift-; then one key (esc returns to main)
# ---------------------------------------------------------------------------
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']       # reset window tree
c = ['reload-config', 'mode main']                # was alt-shift-c in main
backspace = ['close-all-windows-but-current', 'mode main']

# Join the focused window into a neighbor's container
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
